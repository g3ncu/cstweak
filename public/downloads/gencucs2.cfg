bind "kp_3"                               "buy smokegrenade;"
bind "kp_del"                             "buy molotov;"
bind "kp_9"                               "buy hegrenade;"
bind "g"                                  "buy vesthelm;"
bind "h"                                  "buy deagle;"
bind "j"                                  "buy vest;"
bind "Home"                               "buy hegrenade;"
bind "ins"                                "buy defuser;"
bind "\"                                  "buy flashbang;"
