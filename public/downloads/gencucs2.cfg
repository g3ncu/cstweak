// =====================================================================
// geNcuez CS2 Autoexec Configuration
// =====================================================================

cl_input_enable_raw_keyboard true

// 1. Görünüm ve FOV Ayarları
// ---------------------------------------------------------------------
viewmodel_fov                             "60"
viewmodel_offset_x                        "2.5"
viewmodel_offset_y                        "2"
viewmodel_offset_z                        "-2"
viewmodel_presetpos                       "3"
cl_crosshair_sniper_width                 "2"
cl_crosshair_friendly_warning             "0"
cl_teamcounter_playercount_instead_of_avatars "true"
cl_radar_scale                            "0.27"
cl_radar_icon_scale_min                   "1.25"
cl_hud_radar_map_additive                 "0"
hud_scaling                               "1"
cl_hud_color                              "8"
cl_teamid_overhead_fade_near_crosshair    "0.75"

// 2. Ses Ayarları
// ---------------------------------------------------------------------
snd_steamaudio_enable_perspective_correction "0"
snd_spatialize_lerp                       "0.7"
snd_headphone_eq                          "0"
snd_voipvolume                            "2"
snd_menumusic_volume                      "0"
snd_roundend_volume                       "0"
snd_roundstart_volume                     "0"
snd_tensecondwarning_volume               "0.4"
snd_mapobjective_volume                   "0"
snd_deathcamera_volume                    "0"
snd_mute_losefocus                        "false"
snd_mvp_volume                            "0"
volume                                    "0.35"
bind "uparrow"                            "volume 0.35"
bind "downarrow"                          "volume 0.0035"

// 3. FPS ve Performans Ayarları
// ---------------------------------------------------------------------
rate                                      "1000000"
r_drawtracers_firstperson                 "0"
r_fullscreen_gamma                        "2.2"
engine_no_focus_sleep                     "0"
fps_max                                   "0"

// 4. Radar ve HUD Ayarları
// ---------------------------------------------------------------------
cl_hud_radar_background_alpha             "1"
cl_hud_radar_blur_background              "false"
cl_hud_radar_map_additive                 "false"
cl_hud_radar_scale                        "1.3"
cl_radar_always_centered                  "true"
cl_radar_icon_scale_min                   "1.25"
cl_radar_rotate                           "true"
cl_radar_scale                            "0.27"
cl_radar_scale_dynamic                    "true"
cl_radar_square_always                    "false"
cl_radar_square_with_scoreboard           "false"

cl_hud_telemetry_frametime_show           "2"
cl_hud_telemetry_ping_show                "2"
cl_hud_telemetry_net_misdelivery_show     "2"
cl_showloadout                            "true"
cl_use_opens_buy_menu                     "false"
hud_showtargetid                          "true"
cl_teammate_colors_show                   "2"
cl_sanitize_muted_players                 "false"
cl_sanitize_player_names                  "false"

// 5. Hassasiyet (Sensitivity) ve Kontroller
// ---------------------------------------------------------------------
sensitivity                               "1.15"
zoom_sensitivity_ratio                    "1"

// 6. Konsol ve Oyun Ayarları
// ---------------------------------------------------------------------
con_enable                                "true"
mm_dedicated_search_maxping               "100"
cl_dm_buyrandomweapons                    "false"
cl_debounce_zoom                          "false"
r_show_build_info                         "false"
cl_allow_animated_avatars                 "false"
joystick                                  "false"

